packages:
  - 'vendor/*'

allowBuilds:
  '@swc/core': false
  cbor-extract: false
  core-js: false
  esbuild: false
  sharp: false
  unrs-resolver: false

# Security patches for transitive dependencies. Remove each once its parent resolves a fixed version.
overrides:
  devalue@5: 5.9.3
  nanoid@5: 5.1.16
  refractor>prismjs: 1.30.0
  source-map-js@1: 1.2.2
  undici@7: 7.30.1
  vite@8: 8.3.5
