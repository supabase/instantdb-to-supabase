name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm vendor:check
      - run: pnpm typecheck
      - run: pnpm test:prettier
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm build
      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.114.0
      - name: Start a blank Supabase project
        run: |
          mkdir -p "$RUNNER_TEMP/instant-import"
          supabase init --workdir "$RUNNER_TEMP/instant-import"
          supabase start --workdir "$RUNNER_TEMP/instant-import" --exclude studio,logflare,vector,supavisor,imgproxy,edge-runtime
      - name: Start the private job and upload service
        run: |
          mkdir -p "$RUNNER_TEMP/instant-import-service/supabase"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          config = (root / 'instant-import/supabase/config.toml').read_text()
          import re
          config = re.sub(r'^(\s*port\s*=\s*)543(\d\d)\b', r'\g<1>553\2', config, flags=re.M)
          config = config.replace('project_id = "instant-import"', 'project_id = "instant-import-service"')
          (root / 'instant-import-service/supabase/config.toml').write_text(config)
          PYTHON
          supabase start --workdir "$RUNNER_TEMP/instant-import-service" --exclude studio,logflare,vector,supavisor,imgproxy,edge-runtime
      - name: Configure local test credentials
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { randomBytes } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          const keys = JSON.parse(execFileSync('supabase', ['status', '--workdir', `${process.env.RUNNER_TEMP}/instant-import`, '--output', 'json'], { encoding: 'utf8' }))
          const values = { IMPORT_TEST_DATABASE_URL: keys.DB_URL, IMPORT_TEST_SUPABASE_URL: keys.API_URL, IMPORT_TEST_SERVICE_ROLE_KEY: keys.SERVICE_ROLE_KEY }
          const service = JSON.parse(execFileSync('supabase', ['status', '--workdir', `${process.env.RUNNER_TEMP}/instant-import-service`, '--output', 'json'], { encoding: 'utf8' }))
          Object.assign(values, { IMPORT_CREDENTIAL_KEY: randomBytes(32).toString('base64'), IMPORT_JOB_DATABASE_URL: service.DB_URL, IMPORT_JOB_SUPABASE_URL: service.API_URL, IMPORT_JOB_SERVICE_ROLE_KEY: service.SERVICE_ROLE_KEY, IMPORT_TARGETS_JSON: JSON.stringify({test: {databaseUrl: keys.DB_URL, supabaseUrl: keys.API_URL, serviceRoleKey: keys.SERVICE_ROLE_KEY}}), IMPORT_WORKFLOW_TOKEN: 'local-workflow-test-token', IMPORT_WORKFLOW_TEST_URL: 'http://127.0.0.1:3009', WORKFLOW_LOCAL_BASE_URL: 'http://127.0.0.1:3009' })
          for (const [name, value] of Object.entries(values)) appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`)
          JS
      - name: Start the Workflow runtime
        run: |
          pnpm exec next start --port 3009 --hostname 127.0.0.1 > "$RUNNER_TEMP/instant-workflow.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/instant-workflow.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3009/migrate/instantdb/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run unit and Supabase integration tests
        run: pnpm exec vitest run
      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Test the browser import flow
        run: pnpm test:browser
      - name: Stop the disposable project
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/instant-workflow.pid" ]; then kill "$(cat "$RUNNER_TEMP/instant-workflow.pid")" || true; fi
          supabase stop --workdir "$RUNNER_TEMP/instant-import" --no-backup
          supabase stop --workdir "$RUNNER_TEMP/instant-import-service" --no-backup
